# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Maybe Someday (Google's 2022 security competition, by Google; a crypto challenge) as an Isoloom spec:
# a Paillier service that decrypts your ciphertexts and only tells you whether their padding is valid.
# The challenge folder 2022/quals/crypto-maybe-someday of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2022-maybe-someday

networks:
  lab: { cidr: 10.60.184.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the server sends its public key
    script: checks/probe.sh
    wait: 60

message: |
  Maybe Someday (Google, 2022) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  Paillier is homomorphic and the server answers about padding: combine both to learn the secret.
